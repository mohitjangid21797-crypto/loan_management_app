name: loan_management_app
description: "Offline-first loan, EMI and ledger manager for small private lenders."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State and routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0

  # Local database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Storage, auth, device
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0
  local_auth: ^2.3.0
  image_picker: ^1.1.0
  url_launcher: ^6.3.0

  # Backup
  google_sign_in: ^6.2.1
  googleapis: ^13.0.0
  http: ^1.2.0
  encrypt: ^5.0.3
  crypto: ^3.0.0

  # Documents and notifications
  pdf: ^3.11.0
  printing: ^5.13.0
  flutter_local_notifications: ^17.0.0

  # Utilities
  intl: any
  logger: ^2.4.0
  equatable: ^2.0.5
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.0
  mocktail: ^1.0.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
